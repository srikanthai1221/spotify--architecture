services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: spotify-rag-backend
    env_file:
      - .env
    environment:
      FAISS_MAX_DISTANCE: ${FAISS_MAX_DISTANCE:-1.0}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./database:/app/database
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: spotify-rag-frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped
